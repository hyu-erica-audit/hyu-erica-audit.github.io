<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>관리자 로그인 | ERICA 중앙감사위원회</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/common/logo.png?v=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css?family=Nanum+Gothic&display=swap" rel="stylesheet">
    <link href="/assets/css/style.css" rel="stylesheet">
    <link href="/assets/css/admin.css" rel="stylesheet">
</head>
<body class="admin-auth-body">
    <main class="admin-auth-main">
        <section class="admin-login-panel">
            <div class="admin-login-brand">
                <img src="/assets/images/common/logo.png" alt="중앙감사위원회 로고">
                <div>
                    <p class="admin-eyebrow mb-1">ERICA Audit Committee</p>
                    <h1>관리자 로그인</h1>
                </div>
            </div>

            <form id="admin-login-form" class="admin-login-form" autocomplete="on">
                <div class="mb-3">
                    <label for="admin-email" class="form-label">이메일</label>
                    <input type="email" class="form-control" id="admin-email" autocomplete="username" required>
                </div>

                <div class="mb-3">
                    <label for="admin-password" class="form-label">비밀번호</label>
                    <input type="password" class="form-control" id="admin-password" autocomplete="current-password" required>
                </div>

                <div id="admin-login-message" class="admin-message" role="alert" aria-live="polite"></div>

                <button type="submit" class="btn btn-dark w-100 admin-submit-btn">
                    <span class="admin-submit-label">로그인</span>
                    <span class="admin-submit-spinner spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
                </button>
            </form>

            <a href="/index.html" class="admin-home-link">
                <i class="bi bi-arrow-left"></i>
                홈페이지로 돌아가기
            </a>
        </section>
    </main>

    <script type="module" src="/assets/js/pages/admin-login.js"></script>
</body>
</html>
