---
title: "일정표"
description: "중앙감사위원회의 감사 일정과 회의 일정을 달력으로 확인할 수 있습니다."
---
<!DOCTYPE html>
<html lang="ko">

<head>
    {% include head-common.html %}
    <link href="/assets/css/schedule.css" rel="stylesheet">
</head>

<body>

    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MMGHX3TF"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>




    <div id="navbar-placeholder"></div>


    <script defer src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>


    <main id="main-content">

        <div id="page-header-placeholder"
            data-title="중앙감사위원회 일정표"
            data-subtitle="Schedule of the Central Audit Committee">
        </div>
        <section class="py-5 bg-light" style="overflow-x: hidden;">
            <div class="calendar-window">
                <div id="schedule-rail" class="schedule-rail">

                    <div id="calendar-col">
                        <div class="card border-0 shadow-sm p-3 p-md-4">
                            <div id="calendar"></div>
                        </div>
                    </div>

                    <div id="detail-col">
                        <div class="card border-0 shadow-lg h-100">
                            <div class="card-header bg-white border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                                <h5 class="fw-bold mb-0" id="sideTitle">일정 상세</h5>
                                <button type="button" class="btn-close" onclick="closeDetail()"></button>
                            </div>
                            <div class="card-body p-4">
                                <div class="mb-4">
                                    <small class="text-primary fw-bold text-uppercase">Period</small>
                                    <div id="sideDate" class="fs-6 fw-bold mt-1"></div>
                                </div>
                                <hr>
                                <div class="mt-4">
                                    <small class="text-primary fw-bold text-uppercase mb-2 d-block">Description</small>
                                    <p id="sideDescription" class="text-body small keep-all" style="line-height: 1.8;"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <script type="module" src="/assets/js/pages/schedule.js?v=20260703"></script>




    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/main.js?v=20260703"></script>
</body>
</html>
