<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 페이지 제목 설정 (최상단) -->
    <title>회의록</title>

    <!-- 페이지 로고 설정 (최상단) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/common/logo.png?v=1">
    <link rel="apple-touch-icon" href="/assets/images/common/logo.png">

    <!-- 건들지 마세요 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css?family=Nanum+Gothic&display=swap" rel="stylesheet">

    <!-- 스타일 불러오기 -->
    <link href="/assets/css/style.css" rel="stylesheet"> 
</head>

<body>
    <!-- 상단 네비게이션 바 불러오기 -->
    <!-- assets/js/main.js가 assets/components/navbar.html을 불러옴 -->
    <div id="navbar-placeholder"></div>



    <!-- 메인 -->
    <main>
        <!-- 페이지 헤더 불러오기 -->
        <div id="page-header-placeholder" 
            data-title="회의록" 
            data-subtitle="Minutes of Meeting">
        </div>
        <section class="py-5 bg-light">
            <div class="container">
                <div class="d-flex justify-content-between align-items-end mb-4">
                    <div>
                        <h3 class="fw-bold mb-0"><i class="bi bi-journal-check me-2"></i>정기/임시 회의록</h3>
                        <p class="text-muted small mb-0">중앙감사위원회의 모든 의사결정 과정을 투명하게 공개합니다.</p>
                    </div>
                </div>

                <div class="row g-3" id="minutes-container">
                    </div>

                <div id="no-data" class="text-center py-5 d-none">
                    <i class="bi bi-folder-x text-secondary" style="font-size: 3rem;"></i>
                    <p class="mt-3 text-muted">등록된 회의록이 없습니다.</p>
                </div>
            </div>
        </section>
    </main>     

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const MINUTES_DIR = "/assets/docs/minutes/";

        const minutesData = [
            { 
                date: "2026. 02. 09.", 
                title: "2월 정기회의 회의록", 
                fileName: "중감위 2월 정기회의 회의록.pdf",
                category: "정기회의",
                isImportant: false
            },
        ];

        const container = document.getElementById('minutes-container');

        if (container) {
            container.innerHTML = "";
            minutesData.forEach(item => {
                const fullPath = MINUTES_DIR + item.fileName;

                const cardHtml = `
                    <div class="col-12 mb-3">
                        <div class="card border-0 shadow-sm transition-card">
                            <div class="card-body p-4">
                                <div class="row align-items-center">
                                    <div class="col-md-2 text-center border-end">
                                        <div class="text-primary fw-bold">${item.date}</div>
                                        <span class="badge ${item.isImportant ? 'bg-danger' : 'bg-light text-dark border'} mt-1">
                                            ${item.category}
                                        </span>
                                    </div>
                                    <div class="col-md-7 py-2 py-md-0">
                                        <h5 class="fw-bold mb-0 ms-md-3">${item.title}</h5>
                                    </div>
                                    <div class="col-md-3 text-md-end">
                                        <a href="${fullPath}" 
                                        class="btn btn-primary rounded-pill px-4 fw-bold w-100 w-md-auto btn-minutes-download" 
                                        download 
                                        data-filename="${item.fileName}"> <i class="bi bi-file-earmark-pdf me-1"></i> 다운로드
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }
    });
    </script>

    <style>
    @media (min-width: 768px) {
        .border-end-md {
            border-right: 1px solid #dee2e6 !important;
        }
    }
    .transition-card {
        transition: transform 0.2s ease-in-out;
    }
    .transition-card:hover {
        transform: scale(1.01);
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1) !important;
    }
    </style>

    <!-- 하단 푸터 불러오기 -->
    <!-- assets/js/main.js가 assets/components/footer.html을 불러옴 -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/main.js"></script>
</body>
</html>
