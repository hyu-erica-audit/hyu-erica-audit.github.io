<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 페이지 제목 설정 (최상단) -->
    <title>서식 다운로드</title>

    <!-- 페이지 로고 설정 (최상단) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/common/logo.png?v=1">
    <link rel="apple-touch-icon" href="/assets/images/common/logo.png">

    <!-- 건들지 마세요 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css?family=Nanum+Gothic&display=swap" rel="stylesheet">

    <!-- 스타일 불러오기 -->
    <link href="/assets/css/style.css" rel="stylesheet"> 
</head>

<body>
    <!-- 상단 네비게이션 바 불러오기 -->
    <!-- assets/js/main.js가 assets/components/navbar.html을 불러옴 -->
    <div id="navbar-placeholder"></div>



    <!-- 메인 -->
    <main>
        <!-- 페이지 헤더 불러오기 -->
        <div id="page-header-placeholder" 
            data-title="서식 다운로드" 
            data-subtitle="Download Forms">
        </div>
        <section class="py-5 bg-light">
            <div class="container">
                
                <div class="mb-5">
                    <h3 class="fw-bold mb-4"><i class="bi bi-file-earmark-text me-2"></i>중앙감사 보고서</h3>
                    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="admin-container">
                        </div>
                </div>

                <hr class="my-5 opacity-10">

                <div>
                    <h3 class="fw-bold mb-4"><i class="bi bi-folder2-open me-2"></i>증빙 양식</h3>
                    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="report-container">
                        </div>
                </div>

            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/main.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const BASE_PATH = "/assets/docs/";

            // 1. 상단 섹션 데이터 (status: 'ready'는 준비중, 'active'는 다운로드 가능)
            const adminForms = [
                { id: "a1", title: "준비 중", file: "", icon: "bi-hourglass-split", color: "text-secondary", status: "ready" },
                // 나중에 파일이 준비되면 아래처럼 status를 active로 바꾸고 file명을 넣으세요.
                // { id: "a2", title: "감사 결과 공고문", file: "notice.docx", icon: "bi-megaphone", color: "text-primary", status: "active" }
            ];

            // 2. 하단 섹션 데이터 (기존 데이터 유지)
            const reports = [
                { id: "r1", title: "대중교통 실비 지급 보고서", file: "2026 중감위 대중교통 실비 지급 보고서.docx", icon: "bi-bus-front", color: "text-primary" },
                { id: "r2", title: "렌터카 이용 보고서", file: "2026 중감위 렌터가 이용 보고서.docx", icon: "bi-car-front", color: "text-secondary" },
                { id: "r3", title: "택시 이용 보고서", file: "2026 중감위 택시 이용 보고서.docx", icon: "bi-taxi-front", color: "text-body" },
                { id: "r4", title: "주유비 실비 지급 보고서", file: "2026 중감위 주유비 실비 지급 보고서.docx", icon: "bi-fuel-pump", color: "text-success" },
                { id: "r5", title: "식대 집행 보고서", file: "2026 중감위 식대 집행 보고서.docx", icon: "bi-cart", color: "text-dark" }
            ];

            // 카드 생성 함수
            function createCard(item, isReady) {
                const buttonHtml = isReady 
                    ? `<button class="btn btn-secondary w-100 rounded-pill fw-bold" disabled>준비 중입니다</button>`
                    : `<a href="${BASE_PATH}${item.file}" class="btn btn-outline-dark w-100 rounded-pill fw-bold" download><i class="bi bi-download me-2"></i> 다운로드</a>`;
                
                const opacityStyle = isReady ? `style="opacity: 0.7;"` : "";
                
                return `
                    <div class="col">
                        <div class="card h-100 border-0 shadow-sm transition-card" ${opacityStyle}>
                            <div class="card-body p-5 text-center">
                                <div class="mb-3">
                                    <i class="bi ${item.icon} ${item.color}" style="font-size: 3rem;"></i>
                                </div>
                                <h5 class="fw-bold mb-3 ${isReady ? 'text-muted' : ''}">${item.title}</h5>
                                ${buttonHtml}
                            </div>
                        </div>
                    </div>
                `;
            }

            // 상단 렌더링
            const adminContainer = document.getElementById('admin-container');
            adminForms.forEach(form => {
                adminContainer.innerHTML += createCard(form, form.status === "ready");
            });

            // 하단 렌더링
            const reportContainer = document.getElementById('report-container');
            reports.forEach(report => {
                reportContainer.innerHTML += createCard(report, false);
            });
        });
    </script>
</body>
</html>
